<!DOCTYPE html>
<html lang="en">
<head>
  <title>{{.Cfg.SiteTitle}}</title>
  {{template "headtags" .}}
  {{template "seo" .}}
  {{.TrackingScript}}
</head>
<body>
  {{template "sysheader" .}}

  <div class="grid" id="grid">
    {{- range .Items}}
    {{template "card" .}}
    {{- else}}
    <p class="empty">Nothing here yet.</p>
    {{- end}}
  </div>

  {{template "tail" .}}
</body>
</html>
