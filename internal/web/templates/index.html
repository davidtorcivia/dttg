<!DOCTYPE html>
<html lang="en"{{if .ThemeAttr}} data-theme="{{.ThemeAttr}}"{{end}}>
<head>
  <title>{{.Cfg.SiteTitle}}</title>
  {{template "headtags" .}}
  {{template "seo" .}}
  {{.TrackingScript}}
</head>
<body>
  {{template "sysheader" .}}

  <div class="grid" id="grid" style="--cols:{{.BoardColumns}}">
    {{- range .Items}}
    {{template "card" .}}
    {{- else}}
    <p class="empty">Nothing here yet.</p>
    {{- end}}
  </div>

  <div id="board-more" data-offset="{{len .Items}}" data-cat="{{.ActiveCat}}" data-tag="{{.ActiveTag}}" data-page="48"></div>

  {{template "colophon" .}}
  {{template "tail" .}}
</body>
</html>
