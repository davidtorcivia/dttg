<!DOCTYPE html>
<html lang="en"{{if .ThemeAttr}} data-theme="{{.ThemeAttr}}"{{end}}>
<head>
  <title>Login — {{.Cfg.SiteTitle}}</title>
  {{template "headtags" .}}
</head>
<body>
  {{template "sysheader" .}}
  <div class="login-wrap">
    <h1>Restricted</h1>
    <form method="POST" action="/login">
      <label for="login-password" class="visually-hidden">Password</label>
      <input type="password" id="login-password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
      <button type="submit">Enter</button>
      {{if .Error}}<div class="login-error">{{.Error}}</div>{{end}}
    </form>
  </div>
  {{template "tail" .}}
</body>
</html>
