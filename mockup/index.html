<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #ffffff; --text: #111; --line: #e5e5e5; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 4rem; overflow-x: hidden; }
    
    .header { display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 1rem; margin-bottom: 3rem; font-size: 0.8rem; letter-spacing: 0.05em; text-transform: uppercase; }
    
    /* MASONRY GRID */
    .grid { column-count: 3; column-gap: 2rem; display: block; }
    .card { break-inside: avoid; display: flex; gap: 0.8rem; align-items: stretch; border-top: 1px solid var(--line); padding-top: 1rem; margin-bottom: 4rem; cursor: pointer; text-decoration: none; color: inherit; opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); }
    .card.visible { opacity: 1; transform: translateY(0); }
    .card.visible:hover { opacity: 0.6; transition-duration: 0.3s; }
    
    /* IMAGE CONTAINER */
    .card-img-container { flex: 1; position: relative; }
    .card-img-container img { width: 100%; height: auto; display: block; filter: contrast(1.1); }
    
    /* ALL VERTICAL META CONTAINER (NO TITLES) */
    .card-meta { 
      flex: 0 0 1.5rem; /* Max compression width */
      writing-mode: vertical-rl; 
      text-orientation: mixed;
      display: flex; 
      justify-content: flex-start; /* Align to top */
      border-left: 1px solid var(--line); 
      padding-left: 0.5rem; 
      color: var(--text);
    }
    
    .meta-info { 
      font-size: 0.55rem; 
      display: flex; 
      gap: 1.5rem; /* Vertical spacing between spans */
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 500;
    }

    /* CUSTOM CURSOR */
    @media (pointer: fine) {
      body { cursor: none; }
      .cursor { position: fixed; top: 0; left: 0; width: 12px; height: 12px; background: var(--text); border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%); z-index: 10000; transition: width 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.3s; mix-blend-mode: difference; }
      .cursor.hovering { width: 60px; height: 60px; background: rgba(255,255,255,0.8); }
    }

    /* RESPONSIVE */
    @media (max-width: 1000px) {
      .grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      body { padding: 1.5rem 1rem; }
      .header { flex-direction: column; gap: 0.8rem; align-items: flex-start; font-size: 0.8rem; margin-bottom: 2rem; }
      .grid { column-count: 1; }
      
      /* Mobile Single Column Stack */
      .card { flex-direction: column; gap: 0.8rem; margin-bottom: 3rem; }
      .card-img-container { flex: auto; width: 100%; }
      .card-meta { 
        writing-mode: horizontal-tb; 
        flex: auto; 
        width: 100%; 
        border-left: none; 
        padding-left: 0; 
      }
      .meta-info { 
        font-size: 0.7rem; /* Readable on mobile */
        width: 100%; 
        justify-content: space-between; /* Spread across the bottom */
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>INDEX //</div>
    <div>DO NOT TOUCH THE GLASS</div>
    <div id="sys-clock">00:00 // NYC --°F</div>
  </div>

  <div class="grid" id="grid"></div>

  <script>
    const mockData = [
      { id: 1, category: "Architecture", date: "OCT 14", imgUrl: "https://images.unsplash.com/photo-1513694203232-719a280e022f?q=80&w=2069&auto=format&fit=crop" },
      { id: 2, category: "Sculpture", date: "NOV 02", imgUrl: "https://images.unsplash.com/photo-1582555172866-f73bb12a2ab3?q=80&w=2102&auto=format&fit=crop" },
      { id: 3, category: "Photography", date: "DEC 12", imgUrl: "https://images.unsplash.com/photo-1616423640778-28d1b53229bd?q=80&w=1964&auto=format&fit=crop" },
      { id: 4, category: "Graphic Design", date: "JAN 05", imgUrl: "https://images.unsplash.com/photo-1572949645841-094f3a9c4c94?q=80&w=1974&auto=format&fit=crop" },
      { id: 5, category: "Interior", date: "FEB 18", imgUrl: "https://images.unsplash.com/photo-1600210492486-724fe5c67fb0?q=80&w=1974&auto=format&fit=crop" },
      { id: 6, category: "Layout", date: "MAR 22", imgUrl: "https://images.unsplash.com/photo-1550684376-efcbd6e3f031?q=80&w=1974&auto=format&fit=crop" },
      { id: 7, category: "Texture", date: "APR 01", imgUrl: "https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&w=1955&auto=format&fit=crop" },
      { id: 8, category: "Art", date: "MAY 15", imgUrl: "https://images.unsplash.com/photo-1541701494587-cb58502866ab?q=80&w=2070&auto=format&fit=crop" }
    ];

    document.addEventListener('DOMContentLoaded', () => {
      const grid = document.getElementById('grid');
      mockData.forEach(item => {
        grid.innerHTML += `
          <a href="detail.html" class="card">
            <div class="card-img-container">
              <img src="${item.imgUrl}" alt="Archive Item">
            </div>
            <div class="card-meta">
              <div class="meta-info">
                <span>ID:${item.id}</span>
                <span>${item.category}</span>
                <span>${item.date}</span>
              </div>
            </div>
          </a>
        `;
      });

      // Staggered Entrance Animation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

      document.querySelectorAll('.card').forEach((card, index) => {
        card.style.transitionDelay = `${(index % 3) * 0.1}s`; // Stagger columns
        observer.observe(card);
      });
    });

    // Custom Cursor Logic
    if (window.matchMedia("(pointer: fine)").matches) {
      const cursor = document.createElement('div');
      cursor.className = 'cursor';
      document.body.appendChild(cursor);
      
      document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
      
      document.body.addEventListener('mouseover', e => {
        if(e.target.closest('a') || e.target.closest('.card')) {
          cursor.classList.add('hovering');
        } else {
          cursor.classList.remove('hovering');
        }
      });
    }

    // Dynamic header elements
    const clock = document.getElementById('sys-clock');
    let currentTemp = '--';

    async function fetchWeather() {
      try {
        const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&current_weather=true&temperature_unit=fahrenheit');
        const data = await res.json();
        currentTemp = Math.round(data.current_weather.temperature);
        updateClock();
      } catch (e) {
        console.error('Weather fetch failed', e);
      }
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
      clock.textContent = `${timeStr} // NYC ${currentTemp}°F`;
    }

    setInterval(updateClock, 1000);
    updateClock();
    fetchWeather();
    setInterval(fetchWeather, 30 * 60 * 1000);
  </script>
</body>
</html>
